name: Profile Updater

on:
  schedule:
    - cron: '30 5 * * *'
    - cron: '30 11 * * *'
    - cron: '30 17 * * *'
    - cron: '30 23 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

# Two runs must not race to force-push the output branch.
concurrency:
  group: profile-output
  cancel-in-progress: false

jobs:
  draw-sheets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Draw the sheets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php profile-generator.php

      # The SVGs live on an orphan branch with a single commit, so main keeps a clean history.
      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A
          git commit -q -m "🤖 Redraw sheets - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
